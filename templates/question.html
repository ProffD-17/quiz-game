{% extends 'layout.html' %}
{% block body %}
    <main>
        <div class="text-center container">
            <aside class="flashcard-sidebar">
                <h2>Round info</h2>
                <p>Difficulty: {{ difficulty }}</p>
                <p id="streak">Streak: 0</p>
                <p id="top-streak">Top streak: 0</p>
            </aside>
            <div class="content">
                <h2>Question</h2>
                <p id="category"></p>
                <p id="subtopic"></p>
                <p id="question"></p>
                <input autofocus type="text" id="user-answer" placeholder="Your answer">
                <button class="btn" id="check" type="submit">Check</button>
                <button id="next-question" class="btn"></button>
                <p id="feedback" class="hide"></p>
                <p id="correct-answer" class="hide"></p>
            </div>
            
        </div>
    </main>

    <!-- default scripts -->
     <script type='text/javascript' src='{{ url_for("static", filename="marker.js") }}'></script>
     <script type='text/javascript' src='{{ url_for("static", filename="streak.js") }}'></script>

    {% block scripts %}
    {% endblock %}


{% endblock %}
