{% extends 'layout.html' %}
{% block body %}

    <main>
        <h1>Home</h1>
        <h2>Random questions</h2>
        <form action="/random_question" method="get">
            <label for="difficulty">Difficulty(1-3)</label>
            <input type="number" max="3" min="1" name="difficulty" id="difficulty" value="1">
            <button type="submit">Start quiz</button>
        </form>
        <h2>Quiz by group</h2>
        <form action="/question_by_group" method="get">
            <label for="group">Choose group</label>
            <select name="group" id="group">
                <option value="">Loading groups</option>
            </select>
        </form>
    </main>

    <script type='text/javascript' src='{{ url_for("static", filename="groups.js") }}'></script>

{% endblock %}
